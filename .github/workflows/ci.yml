name: CI

# Least privilege: nothing in this workflow needs to write to the repository.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python >= 3.11 and mypy is configured
        # with python_version = "3.11", so that version has to be executed, not
        # only declared. 3.11 deliberately skips the locked install, because
        # requirements-dev.lock was resolved for 3.13: its pins are the same, but
        # the hashes were compiled for that version. Until the lock is
        # regenerated, 3.11 installs from requirements.in's ranges and proves
        # only that the code runs on the declared minimum.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Install unlocked dependencies for 3.11 compatibility
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.in -r requirements-dev.in

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: flake8 src tests examples

      - name: Type check
        run: mypy src

  security-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      # No "|| true": the previous workflow swallowed the exit code, so the job
      # stayed green while reporting findings. bandit exits non-zero on issues
      # and must fail the build.
      - name: Run bandit
        run: bandit -r src/ -f screen

  security-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      # Also without "|| true", for the same reason.
      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock

# Secret scanning used to run through gitleaks/gitleaks-action@v2, which needs a
# GITLEAKS_LICENSE secret and pulls a third-party action into the build. Enable
# GitHub's built-in secret scanning and push protection on the repository
# settings instead: no CI dependency and no licence key.
#
# Coverage reporting via codecov/codecov-action@v3 was also dropped. The action
# is deprecated, and it was another unpinned external dependency in a
# cryptography repository. Coverage is still printed in the test job log.
