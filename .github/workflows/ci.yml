name: CI

# Least privilege: nothing in this workflow needs to write to the repository.
permissions:
  contents: read

# Every job installs from a hashed lock and none upgrades pip first: the locks
# pin pip itself (--allow-unsafe), so an upgrade would fetch an unpinned copy
# that the next command immediately replaces.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # pyproject.toml declares 3.13 as the minimum supported interpreter, and
    # requirements-dev.lock is resolved on it. Running the minimum is what
    # makes requires-python an executed claim rather than a comment.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: >-
          python -m pytest tests/ -v --cov=src --cov-report=term-missing
          --cov-fail-under=90

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      # --no-build-isolation makes the build use the setuptools and wheel pinned
      # in the lock instead of fetching the latest backend; --no-deps keeps the
      # runtime set exactly what the lock installed. This is the only step that
      # exercises [build-system] and [tool.setuptools] at all: pytest reaches
      # src/ through pytest.ini's pythonpath, not through an installed package.
      - name: Install the package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: flake8 src tests examples

      - name: Type check
        run: mypy src

  security-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      # No "|| true": the previous workflow swallowed the exit code, so the job
      # stayed green while reporting findings. bandit exits non-zero on issues
      # and must fail the build.
      - name: Run bandit
        run: bandit -r src/ -f screen

  security-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      # Also without "|| true", for the same reason.
      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock

# Secret scanning used to run through gitleaks/gitleaks-action@v2, which needs a
# GITLEAKS_LICENSE secret and pulls a third-party action into the build. Enable
# GitHub's built-in secret scanning and push protection on the repository
# settings instead: no CI dependency and no licence key.
#
# Coverage reporting via codecov/codecov-action@v3 was also dropped. The action
# is deprecated, and it was another unpinned external dependency in a
# cryptography repository. Coverage is still printed in the test job log.
