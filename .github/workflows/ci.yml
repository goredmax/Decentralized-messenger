name: CI

# Least privilege: nothing in this workflow needs to write to the repository.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The lock file is resolved for the Python version that generated it, so the
    # matrix stays on 3.13. Widen it only together with regenerating
    # requirements-dev.lock, otherwise installs drift from the hashes.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing

  security-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # No "|| true": the previous workflow swallowed the exit code, so the job
      # stayed green while reporting findings. bandit exits non-zero on issues
      # and must fail the build.
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r src/ -f screen

  security-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # Also without "|| true", for the same reason.
      - name: Audit locked dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

# Secret scanning used to run through gitleaks/gitleaks-action@v2, which needs a
# GITLEAKS_LICENSE secret and pulls a third-party action into the build. Enable
# GitHub's built-in secret scanning and push protection on the repository
# settings instead: no CI dependency and no licence key.
#
# Coverage reporting via codecov/codecov-action@v3 was also dropped. The action
# is deprecated, and it was another unpinned external dependency in a
# cryptography repository. Coverage is still printed in the test job log.
